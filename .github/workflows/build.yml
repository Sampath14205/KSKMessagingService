  name: Java 17 Spring Boot Build

  on:
    push:
      branches:
        - main
    pull_request:
      branches:
        - main

  # Required by dependency-submission-action
  permissions:
    contents: write

  jobs:
    build:
      name: Build Spring Boot Application
      runs-on: ubuntu-latest

      steps:
        # 1. Checkout source code
        - name: Checkout source
          uses: actions/checkout@v4

        # 2. Install Java 17
        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '17'
            cache: maven

        # 3. Verify Java and Maven
        - name: Verify Java version
          run: |
            java -version
            mvn -version

        # 4. Build Spring Boot application
        - name: Build with Maven
          run: mvn clean package -DskipTests

        # 5. Show generated files
        - name: List generated JAR files
          run: |
            echo "Generated files:"
            ls -lah target/
            echo ""
            echo "JAR files:"
            find target -maxdepth 1 -type f -name "*.jar" -print

        # 6. Upload executable JAR as GitHub Actions artifact
        - name: Upload Spring Boot JAR
          uses: actions/upload-artifact@v4
          with:
            name: ksk-messaging-service-java17
            path: target/*.jar
            if-no-files-found: error

        # 7. Submit Maven dependencies to GitHub Dependency Graph
        - name: Submit Maven dependencies
          uses: advanced-security/maven-dependency-submission-action@v5

